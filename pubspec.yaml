name: deutsch_review
description: Offline-first Wiederholungs-App fuer bereits gelernte Deutschinhalte.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  connectivity_plus: 7.3.1
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  flutter_timezone: 5.1.0
  path_provider: 2.1.6
  sqlite3: 3.6.0
  supabase: 2.16.1
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/grammar/topics.json
    - assets/grammar/exercises.json
